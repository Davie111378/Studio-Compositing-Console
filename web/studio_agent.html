<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Chroma · 演播室合成 Agent</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #fff; color: #1f2329; display: flex; flex-direction: column;
  }
  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 20px; border-bottom: 1px solid #f0f1f3;
  }
  header .logo { font-weight: 700; font-size: 15px; }
  header .logo span { color: #4b5bd7; }
  header .sub { font-size: 12px; color: #9aa0a6; }
  header .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  header button {
    border: 1px solid #e6e8eb; background: #fff; color: #4b5563;
    border-radius: 16px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  header button:hover { background: #f5f6f7; }
  /* ---------- 主区: 画布工作台 (2026-09-12 夸克风格重构) ---------- */
  main { flex: 1; display: flex; min-height: 0; padding: 12px 16px 0; }
  #stage {
    flex: 1; background: #f5f6f8; border: 1px solid #eef0f2; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    position: relative; min-height: 0;
  }
  #stageImg { max-width: 100%; max-height: 100%; object-fit: contain;
    box-shadow: 0 6px 24px rgba(15,23,42,.12); border-radius: 8px; cursor: zoom-in; }
  #stageEmpty { text-align: center; color: #9aa0a6; }
  .se-icon { font-size: 46px; }
  .se-t1 { font-size: 16px; color: #4b5563; margin-top: 8px; }
  .se-t2 { font-size: 12.5px; margin: 6px 0 16px; }
  .se-btn { background: #4b5bd7; color: #fff; border: none; border-radius: 20px;
    padding: 9px 24px; font-size: 14px; cursor: pointer; }
  .se-btn:hover { background: #3a49c0; }
  #stageTip { position: absolute; left: 12px; top: 10px; font-size: 11.5px; color: #b0b6bf;
    background: rgba(255,255,255,.85); border-radius: 10px; padding: 3px 10px; display: none; }
  /* 画布工具条 (撤销/原图) + 圈选浮层 (2026-09-12) */
  #stageTools { position: absolute; right: 12px; top: 10px; display: flex; gap: 6px;
    align-items: center; z-index: 5; }
  #stageTools button { background: rgba(255,255,255,.94); border: 1px solid #e2e5ea;
    border-radius: 15px; padding: 6px 14px; font-size: 12.5px; color: #444; cursor: pointer;
    box-shadow: 0 1px 5px rgba(15,23,42,.10); }
  #stageTools button:hover { background: #eef4ff; border-color: #bcd4f7; color: #1a66d6; }
  #selHint { background: rgba(75,91,215,.92); color: #fff; border-radius: 15px;
    padding: 6px 13px; font-size: 12.5px; }
  #selHint a { color: #fff; text-decoration: underline; margin-left: 8px; cursor: pointer; }
  /* 圈选后即时反馈: 松手后立刻显示"处理中" (不再停留在原图状态) */
  #stageBusy { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: rgba(17,23,41,.86); color: #fff; border-radius: 999px;
    padding: 12px 26px; font-size: 14px; display: flex; align-items: center; gap: 10px;
    z-index: 8; box-shadow: 0 8px 30px rgba(0,0,0,.28); }
  #stageBusy i { width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 圈选意图按钮 (保留/删去) */
  .intentbtn.on { background: #4b5bd7 !important; border-color: #4b5bd7 !important;
    color: #fff !important; font-weight: 600; }
  #selRect { position: absolute; border: 2px dashed #4b5bd7; background: rgba(75,91,215,.12);
    display: none; z-index: 6; pointer-events: none; }
  #selPop { position: absolute; z-index: 7; background: #fff; border: 1px solid #e7e9ee;
    border-radius: 12px; box-shadow: 0 10px 34px rgba(15,23,42,.24); padding: 10px; display: none; }
  #selPop .sp-t { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  #selPop canvas { border: 1px solid #eef0f2; border-radius: 8px; display: block; max-width: 340px; }
  #selPop .sp-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  #selPop .sp-btns button { border: 1px solid #e2e5ea; background: #f6f7f9; border-radius: 8px;
    padding: 7px 13px; font-size: 12.5px; cursor: pointer; }
  #selPop .sp-btns button:hover { background: #eef4ff; border-color: #bcd4f7; color: #1a66d6; }
  #selPop .sp-btns button.primary { background: #4b5bd7; border-color: #4b5bd7; color: #fff; }
  #selPop .sp-btns button.primary:hover { background: #3a49c0; color: #fff; }
  /* 消息 */
  .msg { margin: 14px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg .bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 14px;
    font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: #f2f3f5; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: #fff; border: 1px solid #eef0f2; border-bottom-left-radius: 4px; }
  .msg .tag { display:block; font-size: 11px; color: #b0b6bf; margin-bottom: 4px; }
  /* 工具节点卡 */
  .nodes { margin-top: 8px; border: 1px solid #eef0f2; border-radius: 10px; overflow: hidden; }
  .nodes .row {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 10px; font-size: 12px; color: #4b5563;
    border-top: 1px solid #f4f5f7;
  }
  .nodes .row:first-child { border-top: none; background: #fafbfc; color: #9aa0a6; }
  .nodes .row b { min-width: 26px; font-weight: 500; }
  .nodes .row .ok { color: #1a9e5c; } .nodes .row .fail { color: #d9483b; }
  .nodes .row .skip { color: #b0b6bf; } .nodes .row .keep { color: #4b5bd7; }
  .nodes .row .ms { margin-left: auto; color: #b0b6bf; }
  .meta { margin-top: 6px; font-size: 12px; color: #9aa0a6; display: flex; flex-wrap: wrap; gap: 10px; }
  .meta b { color: #4b5563; font-weight: 500; }
  .msg img.final { margin-top: 8px; max-width: 320px; border-radius: 10px; border: 1px solid #eef0f2; display: block; }
  .final-wrap { margin-top: 8px; display: inline-block; position: relative; }
  .final-wrap img.final { margin-top: 0; }
  .final-wrap .dl { display: block; margin-top: 6px; padding: 5px 14px; font-size: 12px;
    border: 1px solid #4b5bd7; color: #4b5bd7; background: #fff; border-radius: 16px;
    cursor: pointer; transition: all .15s; }
  .final-wrap .dl:hover { background: #4b5bd7; color: #fff; }
  /* 打字点 */
  .dots i { display: inline-block; width: 5px; height: 5px; margin-right: 4px; border-radius: 50%; background: #c3c7cd; animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  /* ---------- 底部: tabs + 抽屉 (2026-09-12 加高: 与画布比例均衡) ---------- */
  #dock { flex: 0 0 38%; min-height: 250px; max-height: 460px;
    padding: 10px 16px 8px; border-top: 1px solid #f0f1f3;
    display: flex; flex-direction: column; }
  #tabs { display: flex; gap: 4px; align-items: center; max-width: 1100px;
    width: 100%; margin: 0 auto 10px; }
  #tabs .tab-spacer { flex: 1; }
  #tabs button { border: none; background: transparent; font-size: 14.5px; color: #6b7280;
    padding: 9px 16px; cursor: pointer; position: relative; border-radius: 8px; }
  #tabs button:hover { background: #f5f6f8; }
  #tabs button.on { color: #1a66d6; font-weight: 600; }
  #tabs button.on::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 3px;
    height: 3px; border-radius: 2px; background: #4b5bd7; }
  /* 撤销 / 全部复原 (工作栏右侧, 2026-09-12 从画布角落挪来更醒目) */
  #tabs .histbtn { border: 1px solid #dbe0e8; background: #fff; color: #374151;
    font-size: 14px; font-weight: 500; padding: 9px 18px; border-radius: 10px; }
  #tabs .histbtn::after { display: none; }
  #tabs .histbtn:hover { background: #eef4ff; border-color: #bcd4f7; color: #1a66d6; }
  #drawer { max-width: 1100px; margin: 0 auto; flex: 1; min-height: 0; width: 100%; }
  #drawer .tabpane { overflow-y: auto; }
  #pane-ai { display: flex; flex-direction: column; height: 100%; }
  #chat { flex: 1; min-height: 120px; overflow-y: auto; padding: 2px 2px 8px; }
  .tabpane .qp-title { font-size: 13px; color: #8a919e; margin-bottom: 10px; }
  .tabpane .qp-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .tabpane .qp-grid button { background: #f6f7f9; border: 1px solid #e7e9ee; border-radius: 10px;
    padding: 11px 20px; font-size: 14px; color: #333; cursor: pointer; transition: .15s; }
  .tabpane .qp-grid button:hover { background: #eef4ff; border-color: #bcd4f7; color: #1a66d6; }
  .tabpane input[type=range] { accent-color: #4b5bd7; width: 100%; max-width: 420px; display: block; }
  #inputCard {
    width: 100%; background: #fff;
    border: 1px solid #e6e8eb; border-radius: 22px;
    box-shadow: 0 4px 24px rgba(15,23,42,.06);
    padding: 14px 16px 10px; transition: box-shadow .2s;
  }
  #inputCard:focus-within { box-shadow: 0 6px 28px rgba(15,23,42,.10); }
  #pending { display: none; margin-bottom: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    background: #f2f3f5; border-radius: 8px; padding: 4px 10px; color: #4b5563;
  }
  .chip a { color: #d9483b; text-decoration: none; margin-left: 2px; }
  #instr {
    width: 100%; border: none; outline: none; resize: none;
    font-size: 15px; line-height: 1.6; font-family: inherit; color: #1f2329;
    min-height: 24px; max-height: 120px;
  }
  #instr::placeholder { color: #b7bcc4; }
  #toolbar { display: flex; align-items: center; margin-top: 10px; }
  .iconbtn {
    width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent;
    color: #6b7280; font-size: 18px; cursor: pointer; line-height: 30px;
  }
  .iconbtn:hover { background: #f2f3f5; }
  #toolbar .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  /* 模式选择 (菜单在 header 内向下弹) */
  #modeWrap { position: relative; }
  #modeBtn {
    border: none; background: transparent; color: #6b7280; font-size: 13px;
    cursor: pointer; padding: 4px 6px; border-radius: 8px;
  }
  #modeBtn:hover { background: #f2f3f5; }
  #modeBtn b { font-weight: 500; }
  #modeMenu {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    background: #fff; border: 1px solid #e6e8eb; border-radius: 12px;
    box-shadow: 0 8px 24px rgba(15,23,42,.10); padding: 4px; min-width: 190px; z-index: 30;
  }
  #modeMenu div {
    padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  #modeMenu div:hover { background: #f5f6f7; }
  #modeMenu div small { display: block; color: #9aa0a6; font-size: 11px; margin-top: 2px; }
  #modeMenu div.on { background: #f0f2ff; color: #4b5bd7; }
  /* 大模型后端选择 */
  #provWrap { position: relative; }
  #provBtn {
    border: none; background: transparent; color: #6b7280; font-size: 13px;
    cursor: pointer; padding: 4px 6px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  #provBtn:hover { background: #f2f3f5; }
  #provBtn b { font-weight: 500; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd0d6; display: inline-block; flex: none; }
  .dot.ok { background: #22c55e; } .dot.bad { background: #ef4444; }
  #provMenu {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    background: #fff; border: 1px solid #e6e8eb; border-radius: 12px;
    box-shadow: 0 8px 24px rgba(15,23,42,.10); padding: 4px; min-width: 230px; z-index: 30;
  }
  #provMenu div { padding: 8px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  #provMenu div:hover { background: #f5f6f7; }
  #provMenu div small { display: block; color: #9aa0a6; font-size: 11px; margin-top: 2px; }
  #provMenu div.on { background: #f0f2ff; color: #4b5bd7; }
  /* 发送键 */
  #sendBtn {
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: #d3d7dd; color: #fff; font-size: 16px; margin-left: 8px;
    transition: background .2s; line-height: 34px; text-align: center;
  }
  #sendBtn.ready { background: #4b5563; }
  #sendBtn.ready:hover { background: #1f2329; }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; }
  /* 免责声明 */
  #disclaimer { text-align: center; font-size: 12px; color: #c9cdd3; padding: 10px 0 14px; }
  /* 附件按钮隐藏原生 input */
  #fileInput { display: none; }
</style>
</head>
<body>
<header>
  <div class="logo">Chroma<span>·</span>演播室工作台</div>
  <div class="sub">单图智能处理 · AI 指令 / 滤镜 / 抠图 / 特效</div>
  <div class="right">
    <div id="provWrap">
      <button id="provBtn" onclick="toggleProvMenu(event)" title="选择大模型后端">
        <span class="dot" id="provDot"></span><b id="provLabel">连接中…</b> ∨</button>
      <div id="provMenu"></div>
    </div>
    <div id="modeWrap">
      <button id="modeBtn" onclick="toggleModeMenu(event)"><b id="modeLabel">快速</b> ∨</button>
      <div id="modeMenu">
        <div data-v="fast" class="on">快速<small>草稿档 · 不自评 · 最快出图(默认)</small></div>
        <div data-v="std">标准<small>草稿档 · Critic 自评(约1~2分钟)</small></div>
        <div data-v="fine">精修<small>精修档 · 抠图精修+自评 · 较慢</small></div>
      </div>
    </div>
    <button onclick="doRollbackPrompt()" title="条件回滚: 换回某背景并保留光照">↩ 回滚背景</button>
    <button onclick="doReset()">新对话</button>
  </div>
</header>

<main>
  <div id="stage">
    <div id="stageTip"></div>
    <div id="stageTools">
      <span id="selHint" style="display:none"></span>
      <button onclick="viewOrig()" title="在新窗口查看当前图（不影响画布与操作）">🔍 看全图</button>
    </div>
    <div id="stageEmpty">
      <div class="se-icon">🖼️</div>
      <div class="se-t1">上传一张图片开始处理</div>
      <div class="se-t2">滤镜 / 抠图 / 特效 / AI 指令换背景 · 单图工作台</div>
      <button class="se-btn" onclick="document.getElementById('fileInput').click()">＋ 选择图片</button>
    </div>
    <img id="stageImg" style="display:none" draggable="false" title="在图片上拖拽/涂抹可圈选处理">
    <div id="stageBusy" style="display:none"><i></i><span id="stageBusyT">处理中…</span></div>
    <div id="selRect"></div>
    <canvas id="selCanvas" style="position:absolute; inset:0; display:none; z-index:6; pointer-events:none"></canvas>
    <div id="selPop">
      <div class="sp-t" id="selPopT"></div>
      <canvas id="selZoom"></canvas>
      <div class="sp-btns" id="selPopB"></div>
    </div>
  </div>
</main>

<div id="dock">
  <div id="tabs">
    <button data-t="ai" class="on">✦ AI指令</button>
    <button data-t="filter">🎨 滤镜</button>
    <button data-t="matting">✂️ 抠图</button>
    <button data-t="fx">✨ 特效</button>
    <span class="tab-spacer"></span>
    <button class="histbtn" onclick="undoLast()" title="撤销上一步操作 (滤镜/特效叠加可逐步回退)">↩ 撤销</button>
    <button class="histbtn" onclick="backToOrig()" title="全部复原: 回到本会话原图">⌂ 全部复原</button>
  </div>
  <div id="drawer">
    <div class="tabpane" id="pane-ai">
      <div id="chat"></div>
      <div id="inputCard">
        <div id="pending"></div>
        <textarea id="instr" rows="1" placeholder="对当前图下指令: 换背景 / 加特效 / 精修…"></textarea>
        <div id="toolbar">
          <button class="iconbtn" title="上传图片或视频 (可多选)" onclick="document.getElementById('fileInput').click()">＋</button>
          <div class="right">
            <button id="sendBtn" onclick="send()">↑</button>
          </div>
        </div>
      </div>
    </div>
    <div class="tabpane" id="pane-filter" style="display:none"></div>
    <div class="tabpane" id="pane-matting" style="display:none"></div>
    <div class="tabpane" id="pane-fx" style="display:none"></div>
  </div>
  <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none">
  <div id="disclaimer">内容由 AI 生成，请仔细甄别</div>
</div>

<script>
const API = "/api/agent/dag";
let mode = "fast";         // fast | std | fine (默认快速, 避免长等待)
let pendingImages = [];    // [{path, name, role, w, h}] role: "input"(前景/绿幕) | "bg"(背景)
let busy = false;
const $ = id => document.getElementById(id);
const chat = $("chat"), instr = $("instr"), sendBtn = $("sendBtn");
document.querySelectorAll("#tabs button[data-t]").forEach(b =>
  b.onclick = () => setTab(b.dataset.t));

/* ---------- 大模型后端选择 (agnes / 千问) ---------- */
let provider = null;            // null = 用服务端默认
let PROV = [];                  // 后端清单
function toggleProvMenu(e){ e.stopPropagation();
  const m = $("provMenu"); m.style.display = m.style.display === "block" ? "none" : "block"; }
function renderProvMenu(){
  $("provMenu").innerHTML = PROV.map(p =>
    `<div data-v="${p.name}" class="${p.name===provider?'on':''}">
       <span class="dot ${p.key_configured?'ok':'bad'}"></span>${p.label}
       <small>${p.chat_model}${p.supports_vision?' · 支持看图':''}${p.key_configured?'':' · 未配置 Key'}</small>
     </div>`).join("") +
    `<div data-v="" class="${provider?'':'on'}"><span class="dot ok"></span>跟随服务端默认
       <small>由 .env 的 LLM_PROVIDER 决定</small></div>`;
  $("provMenu").querySelectorAll("div").forEach(d => d.onclick = e => {
    e.stopPropagation();
    provider = d.dataset.v || null;
    $("provLabel").textContent = provider
      ? (PROV.find(p=>p.name===provider)?.label || provider) : "默认";
    $("provDot").className = "dot " + (provider
      ? (PROV.find(p=>p.name===provider)?.key_configured ? "ok" : "bad") : "ok");
    renderProvMenu();
    $("provMenu").style.display = "none";
  });
}
async function loadProviders(){
  try{
    const r = await fetch("/api/agent/providers"); const j = await r.json();
    PROV = j.providers || [];
    if (!provider) provider = j.current || null;
    const p = PROV.find(x=>x.name===provider);
    $("provLabel").textContent = p ? p.label : "默认";
    $("provDot").className = "dot " + (p ? (p.key_configured?"ok":"bad") : "ok");
    renderProvMenu();
  }catch(e){ $("provLabel").textContent = "默认"; }
}
loadProviders();
async function testProvider(name){
  try{
    const r = await fetch("/api/agent/provider?name=" + encodeURIComponent(name||""));
    const j = await r.json();
    alert(j.ok ? `✓ ${j.provider} 连接正常\n模型: ${j.model}\n延迟: ${j.latency_ms}ms\n回复: ${j.reply}`
               : `✕ 连接失败\n${j.error}`);
  }catch(e){ alert("测试请求失败: " + e); }
}

/* ---------- 模式菜单 ---------- */
const MODE_CN = {fast:"快速", std:"标准", fine:"精修"};
function toggleModeMenu(e){ e.stopPropagation();
  const m = $("modeMenu"); m.style.display = m.style.display === "block" ? "none" : "block"; }
document.querySelectorAll("#modeMenu div").forEach(d => d.onclick = e => {
  e.stopPropagation(); mode = d.dataset.v;
  $("modeLabel").textContent = MODE_CN[mode];
  document.querySelectorAll("#modeMenu div").forEach(x => x.classList.toggle("on", x === d));
  $("modeMenu").style.display = "none";
});
document.addEventListener("click", () => {
  $("modeMenu").style.display = "none";
  const pm = $("provMenu"); if (pm) pm.style.display = "none";
});

/* ---------- 输入框自适应 + Enter 发送 ---------- */
instr.addEventListener("input", () => {
  instr.style.height = "auto";
  instr.style.height = Math.min(instr.scrollHeight, 120) + "px";
  sendBtn.classList.toggle("ready", !!instr.value.trim() || pendingImages.length > 0);
});
instr.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});

/* ---------- 图片上传 (+) 支持多张 ---------- */
$("fileInput").onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  for (const f of files) {
    const b64 = await new Promise(res => { const rd = new FileReader();
      rd.onload = () => res(rd.result); rd.readAsDataURL(f); });
    try {
      const isVideo = /^video\//.test(f.type) || /\.(mp4|webm|mov|avi|mkv)$/i.test(f.name);
      if (isVideo){
        // 视频 → /api/video/upload, 存 mp4
        const r = await api("/api/video/upload", {data: b64, name: f.name});
        pendingImages.push({path: r.path, name: f.name, role: "input", w: 0, h: 0, media:"video"});
      } else {
        const r = await api("/api/upload", {data: b64});
        // 2026-09-12: 去掉手动角色选择——谁当背景/输入完全由指令文本理解,
        // 服务端另有绿幕占比物理判据兜底 (绿的那张=待替换场景)
        pendingImages.push({path: r.path, name: f.name, role: "input", w: r.w, h: r.h, media:"image"});
        lastArtifact = r.path;
        updateStage(r.path, f.name);       // 单图工作台: 上传即上画布
      }
    } catch(err){ alert("上传失败: " + err.message); }
  }
  renderPending();
  if (pendingImages.length) sendBtn.classList.add("ready");
  e.target.value = "";
};
function refLabel(i){ return "图" + (i + 1) + "(" + String.fromCharCode(65 + i) + ")"; }
function renderPending(){
  const box = $("pending");
  if (!pendingImages.length){ box.style.display = "none"; box.innerHTML = ""; return; }
  box.style.display = "block";
  const chips = pendingImages.map((p, i) => {
    const prev = p.media === "video"
      ? `<span style="display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;background:#eee;border-radius:4px;vertical-align:middle">🎬</span>`
      : `<img src="${fileTs("/file?path=" + encodeURIComponent(p.path))}" ` +
        `style="width:22px;height:22px;object-fit:cover;border-radius:4px;vertical-align:middle" alt="预览">`;
    return `<span class="chip">` + prev +
      `${refLabel(i)}·${esc(p.name)}` +
      `<a href="javascript:void(0)" onclick="removeImage(${i})">✕</a></span>`;
  }).join("");
  const hint = pendingImages.length >= 2
    ? `<span class="hint" style="margin-left:8px;font-size:11px">两张图: 直接说"图1(A)作为图2(B)的背景"或"图1替换图2的绿幕背景"，我会自动理解谁是背景</span>`
    : "";
  box.innerHTML = chips + hint;
}
function removeImage(i){
  pendingImages.splice(i, 1);
  renderPending();
  if (!pendingImages.length) sendBtn.classList.remove("ready");
}
function clearPending(){ pendingImages = []; renderPending(); }

/* ---------- 消息渲染 ---------- */
function addUser(text, imgs){
  const imgHtml = (imgs || []).map(p => {
    const prev = p.media === "video"
      ? `<span style="display:inline-block;max-width:150px;border-radius:8px;padding:10px;background:#f2f3f5">🎬 ${esc(p.name)}</span>`
      : `<img src="${fileTs("/file?path=" + encodeURIComponent(p.path))}" ` +
        `style="max-width:150px;border-radius:8px;display:block">`;
    return `<div style="margin-top:6px">` + prev + `</div>`;
  }).join("");
  chat.insertAdjacentHTML("beforeend",
    `<div class="msg user"><div class="bubble">${esc(text)}${imgHtml}</div></div>`);
  chat.scrollTop = chat.scrollHeight;
}
function addAgentHTML(html){
  chat.insertAdjacentHTML("beforeend", `<div class="msg agent"><div class="bubble">${html}</div></div>`);
  chat.scrollTop = chat.scrollHeight;
  return chat.lastElementChild.querySelector(".bubble");
}
function typing(){
  const b = addAgentHTML('<span class="dots"><i></i><i></i><i></i></span>' +
    '<span class="elapsed" style="margin-left:8px;color:#9aa0a6;font-size:12px">0s</span>' +
    '<div class="hint" style="margin-top:6px;font-size:11px;color:#b0b6bf">首次运行需加载模型(约1分钟) · 精修/自评模式更久</div>');
  const t0 = Date.now(), el = b.querySelector(".elapsed");
  bubble_timer = setInterval(() => {
    if (el) el.textContent = Math.round((Date.now() - t0) / 1000) + "s";
  }, 1000);
  return b;
}
let bubble_timer = null;
function stopTimer(){ if (bubble_timer){ clearInterval(bubble_timer); bubble_timer = null; } }
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fileTs = u => u ? u + (u.includes("?") ? "&" : "?") + "t=" + Date.now() : u;
/* 触发浏览器下载保存: 走 /file?download=1 附件头, 跨域/内联场景也能存 */
function downloadFile(url){
  if (!url) return;
  const a = document.createElement("a");
  a.href = url + (url.includes("?") ? "&" : "?") + "download=1";
  a.download = "";            // 让服务端 Content-Disposition 的 filename 生效
  document.body.appendChild(a);
  a.click();
  a.remove();
}
/* 产出图 + 下载按钮 的组合 (点图看大图, 点按钮存盘) */
function resultFigure(url){
  if (!url) return "";
  const src = fileTs(url);
  return `<div class="final-wrap">` +
    `<img class="final" src="${src}" onclick="window.open('${src}')" title="点击查看大图">` +
    `<button class="dl" onclick="downloadFile('${url}')" title="下载保存到本地">⬇ 保存</button>` +
    `</div>`;
}
function nodeTable(steps, totalMs){
  if (!steps || !steps.length) return "";
  const ic = {done:"<span class='ok'>✓</span>", failed:"<span class='fail'>✕</span>",
              skipped:"<span class='skip'>–</span>", kept:"<span class='keep'>♻</span>"};
  const rows = steps.map(x =>
    `<div class="row"><b>${x.node_id}</b><span>${x.tool}</span>` +
    `<span>${ic[x.status]||x.status} ${x.status==="done"?"完成":x.status==="kept"?"缓存复用":x.status==="skipped"?"跳过":"失败"}</span>` +
    (x.engine?`<span style="color:#9aa0a6">${esc(x.engine).slice(0,26)}</span>`:"") +
    `<span class="ms">${x.latency_ms!=null?x.latency_ms+"ms":""}</span>` +
    (x.error?`<span class="fail">${esc(x.error).slice(0,60)}</span>`:"") + `</div>`).join("");
  return `<div class="nodes"><div class="row"><b>执行计划 DAG</b><span></span><span></span>` +
    `<span class="ms">${totalMs!=null?(totalMs/1000).toFixed(1)+"s":""}</span></div>${rows}</div>`;
}

/* ---------- 发送 ---------- */
async function send(){
  if (busy) return;
  const v = instr.value.trim();
  if (!v && !pendingImages.length) return;
  busy = true; sendBtn.disabled = true;
  document.body.classList.add("chatting");
  addUser(v || "(图片)", pendingImages);
  instr.value = ""; instr.style.height = "auto";
  sendBtn.classList.remove("ready");
  const bubble = typing();
  try {
    const payload = {instruction: v || "处理这张图", critic: mode !== "fast"};
    if (mode === "fine") payload.quality = "fine";
    if (provider) payload.provider = provider;
    if (pendingImages.length){
      // 2026-09-12: 去角色化——只传 path+media, 谁是背景/输入由服务端从指令文本
      // (8 组句式) + 绿幕占比物理判据理解, 前端不再做机械猜测
      payload.images = pendingImages.map(p => ({path: p.path,
                                                media: p.media || "image"}));
      if (pendingImages.length === 1) payload.image = pendingImages[0].path;
    }
    const r = await api(API, payload);
    clearPending();
    let h = "";
    if (r.abstain){
      h += `🚫 <b>已拒识</b><br>${esc(r.abstain)}`;
    } else {
      h += nodeTable(r.steps, r.total_ms);
      if (r.critic) h += `<div class="meta">Critic: <b>${Object.entries(r.critic).map(([k,v])=>k+" "+v).join(" · ")}</b>` +
        (r.critic_fix ? ` → ${esc(r.critic_fix)}` : "") + `</div>`;
      if (r.utility) h += `<div class="meta">效用 U=<b>${r.utility.U}</b><span>质量 ${r.utility.quality_term}</span><span>延迟 ${r.utility.latency_term}</span><span>成本 ${r.utility.cost_term}</span></div>`;
      if (r.final_text) h += `<div style="margin-top:8px">${esc(r.final_text)}</div>`;
    }
    stopTimer();
    bubble.innerHTML = h || "(无输出)";
    if (r.cur_url){
      bubble.insertAdjacentHTML("beforeend", resultFigure(r.cur_url));
    }
    if (r.final){ lastArtifact = r.final; updateStage(r.final); }   // 画布跟随最新成片
  } catch(e){
    stopTimer();
    bubble.innerHTML = `❌ ${esc(e.message || String(e))}`;
  }
  busy = false; sendBtn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

/* ---------- 底部 tabs (2026-09-12 夸克风格): AI指令/滤镜/抠图/特效 ---------- */
let curTab = "ai";         // ai | filter | matting | fx
let selIntent = "keep";    // keep=保留圈选内容(抠主体) | remove=删去圈选内容(丝滑消除)
function setIntent(v){ selIntent = v; renderPane(); }
let fxIntensity = 0.6;
let filterStrength = 1.0;  // 参数化预设默认满强度 (参数本身已保守)
let lastArtifact = null;   // 会话最新产物路径 (画布/面板作用图)
const FILTERS = ["清透人像","通透明亮","暖阳","日系奶油","奶油白","胶片",
                 "高级灰","冷调城市","蓝天","晚霞","港风","经典黑白"];
const ENGINES = [["hybrid","hybrid · 色度键+BiRefNet 补洞 (绿幕推荐)"],
                 ["chroma","chroma · 纯色度键 (最快)"],
                 ["refiner","refiner · BiRefNet+精修 (非绿幕)"],
                 ["humanmatting","MODNet · 通用人像 (快)"]];
const FXS = [["spotlight","聚光灯"],["bokeh","光斑散景"],["fog","舞台雾效"],
             ["vignette","暗角"],["color_temp","色温滤镜"],["depth_blur","景深虚化"]];
function setTab(t){
  curTab = t;
  document.querySelectorAll("#tabs button[data-t]").forEach(b =>
    b.classList.toggle("on", b.dataset.t === t));
  ["ai","filter","matting","fx"].forEach(k => {
    const pane = $("pane-" + k);
    if (pane) pane.style.display = (k === t) ? "" : "none";   // ""=还原CSS (pane-ai 为 flex)
  });
  renderPane();
}
function renderPane(){
  if (curTab === "filter"){
    $("pane-filter").innerHTML =
      `<div class="qp-title">自然调色滤镜 · Lightroom 参数引擎 · 无色带不失真 · 点击立即作用到画布图片</div>
       <input type="range" min="0.3" max="1.2" step="0.05" value="${filterStrength}"
         oninput="filterStrength=+this.value;document.getElementById('fsIv').textContent=filterStrength.toFixed(2)">
       <div style="font-size:11.5px;color:#8a919e;margin:2px 0 8px">强度 <b id="fsIv">${filterStrength.toFixed(2)}</b> · 自动保护肤色与高饱和区域</div>
       <div class="qp-grid">${FILTERS.map(f =>
         `<button onclick="runPreset('filter',{preset:'${f}',strength:filterStrength})">${f}</button>`).join("")}</div>`;
  } else if (curTab === "matting"){
    const keep = selIntent === "keep";
    $("pane-matting").innerHTML =
      `<div class="qp-title">抠图引擎 · 点击立即对画布图片抠图 · 抠完可圈选区域检查修改</div>
       <div class="qp-grid">${ENGINES.map(([v, l]) =>
         `<button onclick="runPreset('matting',{engine:'${v}'})">${l}</button>`).join("")}</div>
       <div class="qp-title" style="margin-top:14px">圈选意图 · 决定圈选后怎么处理该部分</div>
       <div class="qp-grid">
         <button class="intentbtn ${keep ? "on" : ""}" onclick="setIntent('keep')">⭕ 保留圈选内容 · 抠出主体</button>
         <button class="intentbtn ${keep ? "" : "on"}" onclick="setIntent('remove')">🚫 删去圈选内容 · 丝滑消除</button>
       </div>
       <div class="qp-title" style="margin-top:14px">圈选方式 · 在画布上涂抹/框选，<b>松手即出结果</b></div>
       <div class="qp-grid">
         <button onclick="armSelect('lasso')">🖊️ 滑动圈选 (按住涂抹${keep ? "主体" : "要去掉的物体"}，松手即出)</button>
         <button onclick="armSelect('rect')">🔲 矩形圈选 (拖框住${keep ? "主体" : "要去掉的物体"}，松手即出)</button>
         <button onclick="armSelect('edit')">✏️ 区域擦除/恢复 (检查修改)</button>
       </div>`;
  } else if (curTab === "fx"){
    $("pane-fx").innerHTML =
      `<div class="qp-title">特效 · 点击立即作用到画布图片 · 强度 <b id="fxIv">${fxIntensity.toFixed(2)}</b></div>
       <input type="range" min="0.1" max="1" step="0.05" value="${fxIntensity}"
         oninput="fxIntensity=+this.value;document.getElementById('fxIv').textContent=fxIntensity.toFixed(2)">
       <div class="qp-grid" style="margin-top:8px">${FXS.map(([v, l]) =>
         `<button onclick="runPreset('fx',{effect:'${v}',intensity:fxIntensity})">${l}</button>`).join("")}</div>`;
  }
}
function updateStage(path, name){
  if (!path) return;
  const img = $("stageImg");
  img.src = fileTs("/file?path=" + encodeURIComponent(path));
  img.style.display = "block";
  $("stageEmpty").style.display = "none";
  $("stageTip").style.display = "block";
  $("stageTip").textContent = name || path.split(/[\\/]/).pop();
}
async function runPreset(kind, params){
  if (busy) return;
  busy = true; sendBtn.disabled = true;
  const label = kind === "filter" ? "滤镜·" + (params.preset || params.filter || "").replace(".png", "")
              : kind === "matting" ? (params.points ? "抠图·滑动圈选"
                  : params.rect ? "抠图·矩形圈选" : "抠图·" + (params.engine || ""))
              : kind === "undo" ? "↩ 撤销上一步"
              : kind === "reset" ? "⌂ 返回原图"
              : kind === "matte_edit" ? (params.op === "inpaint" ? "删去圈选内容·丝滑消除"
                  : params.op === "restore" ? "区域恢复原图" : "区域擦除")
              : "特效·" + (params.effect || "");
  const busyTxt = kind === "matte_edit" && params.op === "inpaint" ? "智能消除融合中…"
                : kind === "matting" && (params.rect || params.points) ? "圈选抠图中…"
                : kind === "filter" ? "调色中…" : kind === "fx" ? "特效处理中…" : "";
  if (busyTxt) showStageBusy(busyTxt);            // 即时反馈: 不让画布停留在原图状态
  addUser("【面板】" + label, []);
  const bubble = typing();
  try {
    // 作用图: 面板显式指定 > 会话最后产物 > 最近上传图 (服务端兜底 ag.cur_image)
    const last = lastArtifact || (pendingImages.length ? pendingImages[pendingImages.length-1].path : null);
    const payload = Object.assign({kind}, params);
    if (last && !payload.image) payload.image = last;
    const r = await api(API, {preset: payload, critic: false});
    let h = nodeTable(r.steps, r.total_ms);
    if (r.final_text) h += `<div style="margin-top:8px">${esc(r.final_text)}</div>`;
    bubble.innerHTML = h || "(无输出)";
    if (r.cur_url) bubble.insertAdjacentHTML("beforeend", resultFigure(r.cur_url));
    if (r.final){ lastArtifact = r.final; updateStage(r.final); }
    hideSelPop();                                  // 圈选浮层随操作完成关闭
  } catch(e){
    bubble.innerHTML = `❌ ${esc(e.message || String(e))}`;
  }
  busy = false; sendBtn.disabled = false;
  hideStageBusy();
  chat.scrollTop = chat.scrollHeight;
}
function showStageBusy(t){ $("stageBusyT").textContent = t; $("stageBusy").style.display = "flex"; }
function hideStageBusy(){ $("stageBusy").style.display = "none"; }

/* ---------- 撤销 / 返回原图 / 画布圈选 (2026-09-12) ---------- */
async function undoLast(){ if (!busy) await runPreset("undo", {}); }
async function backToOrig(){
  if (busy) return;
  // 优先返回最近上传的原图 (会话中途换图时以新图为准); 无上传记录则用会话首图
  const up = pendingImages.length ? pendingImages[pendingImages.length-1].path : null;
  await runPreset("reset", up ? {image: up} : {});
}
let lastSelTs = 0;         // 圈选手势时间戳: 防止松手后的 click 被误判为"看全图"
function viewOrig(){
  // 只有明确点击"看全图"按钮才打开新窗口; 圈选/拖拽后的残留 click 一律忽略
  if (selMode || Date.now() - lastSelTs < 800) return;
  window.open($("stageImg").src);
}

let selMode = null;        // null | "lasso"(滑动涂抹即抠) | "rect"(矩形即抠) | "edit"(擦除/恢复弹窗)
let selDrag = null;        // 矩形拖拽: {x0,y0,box}
let selPts = null;         // 套索轨迹: [{x,y}] 视口坐标
let selNat = null;         // 圈选矩形 (原图像素 [x,y,w,h])
let selBoxSt = null;       // 圈选矩形相对 #stage 的位置 (浮层定位用)
const stageEl = $("stage"), stageImg = $("stageImg");

function armSelect(mode){
  selMode = mode;
  stageImg.style.cursor = "crosshair";
  const what = selIntent === "keep" ? "主体" : "要去掉的部分";
  const tips = {
    lasso: `按住鼠标涂抹${what}，松手立即出结果`,
    rect:  `按住鼠标框住${what}，松手立即出结果`,
    edit:  "在图片上拖拽圈选区域 → 松手后选择擦除或恢复",
  };
  $("selHint").innerHTML = tips[mode] + ` <a onclick="disarmSelect()">取消</a>`;
  $("selHint").style.display = "inline-block";
}
function disarmSelect(){
  selMode = null; selDrag = null; selPts = null;
  stageImg.style.cursor = "zoom-in";
  $("selHint").style.display = "none";
  $("selRect").style.display = "none";
  const sc = $("selCanvas");
  sc.style.display = "none";
  sc.getContext("2d").clearRect(0, 0, sc.width, sc.height);
  hideSelPop();
}
function hideSelPop(){ $("selPop").style.display = "none"; }

stageImg.addEventListener("mousedown", e => {
  if (!selMode || busy) return;
  e.preventDefault();
  lastSelTs = Date.now();        // 抑制松手后浏览器补发的 click (否则会弹全图新窗口)
  if (selMode === "lasso"){
    selPts = [{x: e.clientX, y: e.clientY}];
    const sc = $("selCanvas"), st = stageEl.getBoundingClientRect();
    sc.width = st.width; sc.height = st.height;
    sc.style.display = "block";
    return;
  }
  selDrag = {x0: e.clientX, y0: e.clientY};
  moveSelRect(e);
});
window.addEventListener("mousemove", e => {
  if (!selDrag && !selPts) return;
  if (selMode === "lasso" && selPts){ moveLasso(e); return; }
  if (selDrag) moveSelRect(e);
});
window.addEventListener("mouseup", e => {
  if (selMode === "lasso" && selPts){ finishLasso(); return; }
  if (selDrag) finishSelRect(e);
});
window.addEventListener("keydown", e => { if (e.key === "Escape") disarmSelect(); });

function moveSelRect(e){
  const r = stageImg.getBoundingClientRect(), st = stageEl.getBoundingClientRect();
  const x1 = Math.min(Math.max(e.clientX, r.left), r.right);
  const y1 = Math.min(Math.max(e.clientY, r.top), r.bottom);
  const x = Math.min(selDrag.x0, x1), y = Math.min(selDrag.y0, y1);
  const w = Math.abs(x1 - selDrag.x0), h = Math.abs(y1 - selDrag.y0);
  selDrag.box = {x, y, w, h};
  const sr = $("selRect");
  sr.style.left = (x - st.left) + "px"; sr.style.top = (y - st.top) + "px";
  sr.style.width = w + "px"; sr.style.height = h + "px";
  sr.style.display = "block";
}
function finishSelRect(e){
  const b = selDrag.box; selDrag = null;
  const r = stageImg.getBoundingClientRect(), st = stageEl.getBoundingClientRect();
  $("selRect").style.display = "none";
  if (!b || b.w < 12 || b.h < 12) return;          // 太小 = 误触
  const sx = stageImg.naturalWidth / r.width, sy = stageImg.naturalHeight / r.height;
  selNat = [Math.round((b.x - r.left) * sx), Math.round((b.y - r.top) * sy),
            Math.round(b.w * sx), Math.round(b.h * sy)];
  if (selMode === "rect"){                          // 松手即出结果 (无确认弹窗)
    const nat = selNat; selNat = null;
    runOnSelection(nat, null);
    disarmSelect();
    return;
  }
  selBoxSt = {left: b.x - st.left, top: b.y - st.top, w: b.w, h: b.h};
  openSelPop();                                     // edit 模式: 弹窗选擦除/恢复
}

/* 圈选后立即执行: 保留=抠主体 (GrabCut) / 删去=丝滑消除 (LaMa 修复) */
function runOnSelection(box, points){
  if (selIntent === "remove") runPreset("matte_edit", {op: "inpaint", box: box, points: points});
  else runPreset("matting", {engine: "grabcut", rect: box, points: points});
}

/* 滑动圈选 (涂抹): 轨迹画在覆盖层 canvas, 松手闭合多边形立即抠图 */
function moveLasso(e){
  selPts.push({x: e.clientX, y: e.clientY});
  const st = stageEl.getBoundingClientRect(), ctx = $("selCanvas").getContext("2d");
  ctx.clearRect(0, 0, stageEl.clientWidth, stageEl.clientHeight);
  ctx.beginPath();
  ctx.moveTo(selPts[0].x - st.left, selPts[0].y - st.top);
  for (let i = 1; i < selPts.length; i++)
    ctx.lineTo(selPts[i].x - st.left, selPts[i].y - st.top);
  ctx.strokeStyle = "#4b5bd7"; ctx.lineWidth = 2.5; ctx.lineJoin = "round";
  ctx.stroke();
  ctx.fillStyle = "rgba(75,91,215,.14)"; ctx.fill();
}
function finishLasso(){
  const pts = selPts; selPts = null;
  const sc = $("selCanvas");
  sc.getContext("2d").clearRect(0, 0, sc.width, sc.height);
  sc.style.display = "none";
  if (!pts || pts.length < 6) return;               // 太短 = 误触
  const r = stageImg.getBoundingClientRect();
  const sx = stageImg.naturalWidth / r.width, sy = stageImg.naturalHeight / r.height;
  const flat = [];
  for (const p of pts){
    flat.push(Math.round(Math.min(Math.max(p.x - r.left, 0), r.width) * sx));
    flat.push(Math.round(Math.min(Math.max(p.y - r.top, 0), r.height) * sy));
  }
  runOnSelection(null, flat);                        // 松手即出结果 (无确认弹窗)
  disarmSelect();
}

function drawZoom(nr){
  const [x, y, w, h] = nr, cv = $("selZoom");
  const scale = Math.min(2.2, 340 / Math.max(w, 1));
  cv.width = Math.max(1, Math.round(w * scale));
  cv.height = Math.max(1, Math.round(h * scale));
  cv.getContext("2d").drawImage(stageImg, x, y, w, h, 0, 0, cv.width, cv.height);
}
function openSelPop(){                              // 仅 edit 模式使用 (擦除/恢复)
  drawZoom(selNat);
  $("selPopT").textContent = `选中区域 ${selNat[2]}×${selNat[3]} px · 检查后修改`;
  $("selPopB").innerHTML =
    `<button class="primary" onclick="selAct('erase')">⬜ 擦除此区域</button>
     <button onclick="selAct('restore')">🖼️ 恢复为原图</button>
     <button onclick="disarmSelect()">取消</button>`;
  const pop = $("selPop"), st = stageEl.getBoundingClientRect();
  pop.style.display = "block";
  let pl = selBoxSt.left + selBoxSt.w + 12, pt = selBoxSt.top;
  if (pl + pop.offsetWidth > st.width - 8) pl = Math.max(8, selBoxSt.left - pop.offsetWidth - 12);
  if (pt + pop.offsetHeight > st.height - 8) pt = Math.max(8, st.height - pop.offsetHeight - 8);
  pop.style.left = pl + "px"; pop.style.top = pt + "px";
}
function selAct(op){
  if (!selNat) return;
  runPreset("matte_edit", {op, box: selNat, source: (pendingImages.length ? pendingImages[0].path : null)});
  disarmSelect();
}

/* ---------- 回滚 / 重置 ---------- */
async function doRollbackPrompt(){
  const bg = prompt("回滚到哪个背景? (语义: 访谈/新闻LED/全景/综艺/播客/天气)");
  if (!bg) return;
  busy = true;
  addUser(`↩ 换回「${bg}」背景, 保留光照`);
  const bubble = typing();
  try {
    const r = await api(API, {rollback: bg, critic: false});
    const kept = (r.steps||[]).filter(x=>x.status==="done").map(x=>x.node_id);
    let h = `<div class="meta">重跑 <b>${(r.rerun||[]).join(", ")||"-"}</b> · 光照缓存复用 <b>${(r.kept||[]).join(", ")||"-"}</b></div>`;
    if (r.final_text) h += `<div style="margin-top:6px">${esc(r.final_text)}</div>`;
    bubble.innerHTML = h;
    if (r.cur_url) bubble.insertAdjacentHTML("beforeend", resultFigure(r.cur_url));
    if (r.final){ lastArtifact = r.final; updateStage(r.final); }
  } catch(e){ bubble.innerHTML = "❌ " + esc(e.message||String(e)); }
  busy = false;
}
async function doReset(){
  await api(API, {reset: true});
  chat.innerHTML = ""; document.body.classList.remove("chatting");
  clearPending();
  lastArtifact = null;
  disarmSelect();
  $("stageImg").style.display = "none";
  $("stageEmpty").style.display = "";
  $("stageTip").style.display = "none";
  setTab("ai");
}

async function api(url, obj, timeoutMs = 300000){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const req = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(obj), signal: ctl.signal});
    const j = await req.json();
    if (!req.ok || j.error) throw new Error(j.error || ("HTTP " + req.status));
    return j;
  } catch(e){
    if (e.name === "AbortError") throw new Error("超时(5分钟): 任务过重, 建议用『快速』模式或缩短指令");
    throw e;
  } finally { clearTimeout(t); }
}
