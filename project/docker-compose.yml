services:
  ai-service:
    build:
      context: .
      dockerfile: docker/ai-service.Dockerfile
    container_name: composite-ai-service
    environment:
      - ARTIFACTS_DIR=/workspace/artifacts
      - MOCK_DELAY_MS=${MOCK_DELAY_MS:-120}
      - AI_SERVICE_PORT=8100
    volumes:
      - ./data/artifacts:/workspace/artifacts
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    container_name: composite-agent
    environment:
      - AI_SERVICE_URL=http://ai-service:8100
      - AI_FALLBACK_TO_EMBEDDED=1
      - ARTIFACTS_DIR=/workspace/artifacts
      - RUNS_DIR=/workspace/runs
      - AGENT_HOST=0.0.0.0
      - AGENT_PORT=8000
      - LLM_API_BASE=${LLM_API_BASE:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - PLANNER_MODE=${PLANNER_MODE:-auto}
    volumes:
      - ./data/artifacts:/workspace/artifacts
      - ./data/runs:/workspace/runs
    ports:
      - "8000:8000"
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
